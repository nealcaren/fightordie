project:
  type: website
  output-dir: docs
  resources:
    - CNAME
  render:
    - "!map.qmd"
    - "**/*.qmd"

execute:
  freeze: auto

website:
  title: "Dare You Fight"
  description: "Over 700 editorials by W.E.B. Du Bois from The Crisis magazine (1910-1934), the most sustained campaign of political journalism in American history."
  site-url: https://www.dareyoufight.org
  navbar:
    logo: Images/logo.png
    href: https://www.dareyoufight.org
    background: "#1c1210"
    foreground: "#f0e6e9"
    right:
    - browse.qmd
    - listing.qmd
    - about.qmd
    - href: backround.qmd
      text: "Du Bois & The Crisis"
    - text: More
      menu:
      - covers.qmd
      - credits.qmd
  page-footer:
    left: "© 2025 Neal Caren · University of North Carolina at Chapel Hill"
    right:
      - icon: github
        href: https://github.com/nealcaren/fightordie
    background: "#1c1210"
    foreground: "#d4c4c8"
  open-graph:
    locale: en_US
    site-name: "Dare You Fight"
  twitter-card:
    creator: "@nealcaren"
    card-style: summary_large_image

format:
  html:
    theme: simplex
    css: styles.css
    toc: false
    mainfont: 'EB Garamond'
    link-external-newwindow: true
    link-external-icon: false
    anchor-sections: false
    include-in-header:
      - text: |
          <script type="application/ld+json">
          {
            "@context": "https://schema.org",
            "@type": "DigitalDocument",
            "name": "Dare You Fight: W.E.B. Du Bois in The Crisis",
            "description": "Digital archive of W.E.B. Du Bois's writings from The Crisis magazine (1910-1934)",
            "url": "https://www.dareyoufight.org",
            "author": {
              "@type": "Person",
              "name": "W.E.B. Du Bois",
              "sameAs": "https://en.wikipedia.org/wiki/W._E._B._Du_Bois"
            },
            "publisher": {
              "@type": "Organization",
              "name": "Dare You Fight"
            },
            "about": {
              "@type": "Thing",
              "name": "Civil Rights Movement"
            },
            "inLanguage": "en-US",
            "isAccessibleForFree": true
          }
          </script>

